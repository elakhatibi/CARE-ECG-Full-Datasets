schema_version: care-ecg-security-config.v1

# Explicit engineering-validation cohort; the uncapped config remains available.
# Never use this selection experiment as a held-out or clinical efficacy claim.
protocol:
  phase: validation
  query: Which diagnosis is most supported, and why?
  targets: [T1]
  budgets: [1, 3]
  seeds: [17, 42, 73]
  validation_folds: [9]
  heldout_folds: [10]
  max_candidate_patients_per_target: 30
  max_eligible_patients_per_target: 10
  records_per_patient: first
  defense: v1
  validation_dataset_sha256: b15dc0b71d0400d0697d5b0cbdb4362aaf093ebeb3521d2ec1a21e0a4812755e
  heldout_dataset_sha256: fd90c55c047d5f37a196e98aa127a83629eecd4622c653653fd9511cc33c1868

attacks:
  enabled: [f0, f1_pgd, f1_cf, f2_nes, f2_simba, f2_square, f3_k1, f3_k2, f3_k3]
  common:
    epsilon_mv: 0.02
    step_size_mv: 0.002
    steps: 40
    restarts: 3
    random_start: true
    confidence: 3.0
  f0:
    matched_magnitude: null
    match_statistic: median
  f1_cf:
    latent_weight: 1.0
    latent_margin: 0.001
  f2_nes:
    sigma: 0.002
    learning_rate: 0.004
    samples_per_step: 4
  f2_square:
    initial_fraction: 0.20
  f3_k1:
    black_box_method: nes
  f3_k2:
    search_version: adaptive_v2
    momentum_decay: 0.75
    adaptive_step_factor: 2.0
    auxiliary_scale: 0.1
  f3_k3:
    search_version: adaptive_v2
    momentum_decay: 0.75
    adaptive_step_factor: 2.0
    auxiliary_scale: 0.1

constraints:
  enabled: [s_inf, s_spec]
  s_inf:
    epsilon_mv: 0.02
  s_spec:
    epsilon_mv: 0.02
    cutoff_hz: 40.0
    max_high_frequency_ratio: 0.05
    max_slew_mv: 0.01

admissibility:
  enabled: true
  backend: scipy
  required: [heart_rate_bpm, rhythm_irregularity, pr_ms, qrs_ms, qtc_ms, st_deviation_mv]

export:
  excel: true
